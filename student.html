<script type="module">
  import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const auth = getAuth();
  document.getElementById("logoutBtn").onclick = () => {
    signOut(auth).then(() => window.location.href = "index.html");
  };

  let localStream, isMuted = false;
  document.getElementById("joinCall").onclick = async () => {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    alert("Voice joined (demo mode)");
  };
  document.getElementById("leaveCall").onclick = () => {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    alert("Left voice call");
  };
  document.getElementById("muteToggle").onclick = () => {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
    document.getElementById("muteToggle").innerText = isMuted ? "Unmute" : "Mute";
  };
</script>






<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { Chess } from "./src/lib/chess/chess1.20.0-esm-customised.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAI1oPe7OL78JQtFjscD5y_Wdp5NqoB-J0",
    authDomain: "iq4u-chess-b2835.firebaseapp.com",
    databaseURL: "https://iq4u-chess-b2835-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iq4u-chess-b2835",
    storageBucket: "iq4u-chess-b2835.appspot.com",
    messagingSenderId: "1029237519163",
    appId: "1:1029237519163:web:2b060008c0f11bfe5a3d1e"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getFirestore();

  document.addEventListener("DOMContentLoaded", () => {
    const selector = document.getElementById("pgnSelector");
    const board = Chessboard('myBoard', {
      pieceTheme: './src/lib/chessboardjs/img/chesspieces/wikipedia/{piece}.png',
      position: 'start',
      draggable: true
    });
    const game = new Chess();

    fetch("https://api.github.com/repos/Arjuntamizh/Chess-Trainer/contents/pgns")
      .then(res => res.json())
      .then(files => {
        files.filter(f => f.name.endsWith(".pgn")).forEach(file => {
          const opt = document.createElement("option");
          opt.value = file.download_url;
          opt.textContent = file.name.replace(".pgn", "");
          selector.appendChild(opt);
        });
      });

    selector.addEventListener("change", async function () {
      try {
        const res = await fetch(this.value);
        const pgnText = await res.text();
        if (game.load_pgn(pgnText)) {
          board.position(game.fen());
        } else {
          alert("Invalid PGN format.");
        }
      } catch (err) {
        alert("Failed to load PGN: " + err.message);
      }
    });
  });
</script>

</body>
