<!DOCTYPE html>
<html data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <title>IQ4U Chess</title>
  <meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1.0" />
  <link rel="stylesheet" href="./src/lib/bootstrap/bootstrap-5.3.5.min.css" />
  <script src="./src/lib/bootstrap/bootstrap-5.3.5.bundle.min.js"></script>
  <link rel="stylesheet" href="./src/lib/chessboardjs/chessboard-1.0.0.css" />
  <script src="./src/lib/chessboardjs/chessboard-1.0.0-modified.js"></script>
  <style>
    #myBoard { width: 400px; margin: 20px auto; }
  </style>
</head>
<body>

<h3 class="text-center mt-3">IQ4U Chess</h3>
<div class="text-center">
  <button id="openPGN_button" class="btn btn-primary">Open PGN File</button>
  <input id="openPGN" type="file" accept=".pgn" style="display:none" />
  <select id="pgnSelector" class="form-select fs-5 mt-2 mx-auto" style="max-width: 300px;">
    <option disabled selected>Select PGN</option>
  </select>
</div>

<div class="chessboard" id="myBoard"></div>

<!-- Firebase + PGN Loader -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { Chess } from "./src/lib/chess/chess1.20.0-esm-customised.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAI1oPe7OL78JQtFjscD5y_Wdp5NqoB-J0",
    authDomain: "iq4u-chess-b2835.firebaseapp.com",
    databaseURL: "https://iq4u-chess-b2835-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iq4u-chess-b2835",
    storageBucket: "iq4u-chess-b2835.appspot.com",
    messagingSenderId: "1029237519163",
    appId: "1:1029237519163:web:2b060008c0f11bfe5a3d1e"
  };

  initializeApp(firebaseConfig);
  getAuth();
  getFirestore();

  document.addEventListener("DOMContentLoaded", () => {
    const board = Chessboard('myBoard', {
      pieceTheme: './src/lib/chessboardjs/img/chesspieces/wikipedia/{piece}.png',
      position: 'start',
      draggable: false
    });

    const game = new Chess();
    const selector = document.getElementById("pgnSelector");

    // Populate PGN selector
    fetch("https://api.github.com/repos/Arjuntamizh/Chess-Trainer/contents/pgns")
      .then(res => res.json())
      .then(files => {
        files.filter(f => f.name.endsWith(".pgn")).forEach(file => {
          const opt = document.createElement("option");
          opt.value = file.download_url;
          opt.textContent = file.name.replace(".pgn", "");
          selector.appendChild(opt);
        });
      });

    // Load PGN and play it
    selector.addEventListener("change", async function () {
      try {
        const res = await fetch(this.value);
        const pgnText = await res.text();

        if (game.load_pgn(pgnText)) {
          const finalFen = game.fen();
          board.position(finalFen);
          console.log("PGN loaded and board updated to final position.");
        } else {
          alert("Invalid PGN file.");
        }
      } catch (err) {
        alert("Failed to load PGN: " + err);
      }
    });
  });
</script>

</body>
</html>
